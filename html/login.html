
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="../Css/login.css">
</head>
<body>

    <main class="login-page">

        <!-- Left side -->
        <section class="left-side">

            <div class="promo-content">
                <h1>
                    Explore<br>
                    and<br>
                    connect<br>
                    <span>with love</span>.
                </h1>

                <img src="../images/since.png"
                     alt="Community gatherings"
                     class="promo-image">

                <img src="../images/Ist picture.jpg"
                     alt="Community gatherings"
                     class="promo-image1">
            </div>
        </section>

        <!-- Right side -->
        <section class="right-side">
            <div class="login-form">

                <h2>Log in to Community Hub</h2>

                <form action="login.php" method="post">

                    <div class="input-group">
                        <input type="text"
                               id="email"
                               name="email"
                               placeholder="Email address or mobile number"
                               aria-label="Email address or mobile number"
                               required>
                    </div>

                    <div class="input-group">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Password"
                               aria-label="Password"
                               required>
                    </div>

                    <button type="submit" class="login-btn">
                        Log in
                    </button>

                </form>

                <a href="forgot-password.html" class="forgot-link">
                    Forgotten password?
                </a>

                <div class="separator"></div>

                <a href="Registration.html" class="create-account">
                    Create new account
                </a>


            </div>
        </section>

    </main>

</body>
</html>
