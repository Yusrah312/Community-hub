<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../Css/registration.css">
</head>
<body>

    <main class="registration-page">

        <header class="page-header">
            <a href="index.html" class="back-link" aria-label="Go back">
                &#8249;
            </a>

            <h1>Community Hub</h1>

            <h2>Get started with our community</h2>
            <p class="intro">
                Create an account to connect with your community,
                stay updated with the latest news, and discover events.
            </p>
        </header>

        <form action="submit-contact-form.php"
              method="post"
              enctype="multipart/form-data">

            <div class="form-group">
                <label>Name</label>

                <div class="name-row">
                    <input type="text" id="fname" name="fname"
                           placeholder="First name" required>

                    <input type="text" id="lastname" name="lastname"
                           placeholder="Surname" required>
                </div>
            </div>

            <div class="form-group">
                <label for="day">Date of birth</label>

                <div class="dob-row">
                    <select id="day" name="day" required>
                        <option value="">Day</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>

                    <select id="month" name="month" required>
                        <option value="">Month</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>

                    <select id="year" name="year" required>
                        <option value="">Year</option>
                        <option value="2010">2010</option>
                        <option value="2009">2009</option>
                        <option value="2008">2008</option>
                        <option value="2007">2007</option>
                        <option value="2006">2006</option>
                        <option value="2005">2005</option>
                        <option value="2004">2004</option>
                        <option value="2003">2003</option>
                        <option value="2002">2002</option>
                        <option value="2001">2001</option>
                        <option value="2000">2000</option>
                        <option value="1999">1999</option>
                        <option value="1998">1998</option>
                        <option value="1997">1997</option>
                        <option value="1996">1996</option>
                        <option value="1995">1995</option>
                        <option value="1994">1994</option>
                        <option value="1993">1993</option>
                        <option value="1992">1992</option>
                        <option value="1991">1991</option>
                        <option value="1990">1990</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>

                <select id="gender" name="gender" required>
                    <option value="">Select your gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                    <option value="custom">Prefer not to say</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Mobile number or email address</label>
                <input type="text" id="email" name="email"
                       placeholder="Mobile number or email address"
                       required>
            </div>

            <div class="form-group">
                <label for="Username">Username</label>
                <input type="text" id="Username" name="Username"
                       placeholder="Username" required>
            </div>

            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" name="password"
                       placeholder="New password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password"
                       name="confirm_password"
                       placeholder="Confirm password" required>
            </div>

            <div class="form-group">
                <label for="profile">Profile picture</label>
                <input type="file" id="profile" name="profile"
                       accept="image/*">
            </div>

            <div class="form-group">
                <label for="type">Membership type</label>
                <select id="type" name="type" required>
                    <option value="">Select membership type</option>
                    <option value="basic">Basic Membership</option>
                    <option value="Verified">Verified Resident</option>
                    <option value="local">Local Business</option>
                    <option value="leader">Community Leader</option>
                    <option value="Premium">Premium Membership</option>
                </select>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit">Sign Up</button>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </form>
    </main>

</body>
</html>
